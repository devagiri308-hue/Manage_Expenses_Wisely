{% extends 'expenses/base.html' %}

{% block title %}Salary Settings | Expenses Tracker{% endblock %}

{% block page_heading %}Salary Settings{% endblock %}

{% block content %}

<div class="form-container">

    <div class="form-header">
        <h2>💰 Monthly Salary</h2>
        <p>Set your fixed monthly income.</p>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="monthly_salary">Monthly Salary (₹)</label>

            <input
                type="number"
                id="monthly_salary"
                name="monthly_salary"
                min="0"
                step="0.01"
                value="{{ income.monthly_salary }}"
                required
            >
        </div>

        <button type="submit" class="btn btn-primary">
            Save Salary
        </button>

        <a href="{% url 'dashboard' %}" class="btn">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
